[package]
name = "guardrails-core"
version = "0.0.1"
edition = "2021"
description = "Deterministic, security-critical guardrail core (PyO3) — Rust backend for sec-guardrails"
license = "MIT"

[lib]
name = "guardrails_core"
# cdylib -> the Python extension; rlib -> so `cargo test` can run pure-Rust unit tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.24", features = ["abi3-py311"] }
regex = "1"

[features]
# Opt-in so `cargo test`/`clippy` link libpython and run normally, while the wheel build
# (`maturin build --features extension-module`) activates it for manylinux compliance.
extension-module = ["pyo3/extension-module"]
