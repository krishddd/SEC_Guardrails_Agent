version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      gh-actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: "/crates/guardrails-core"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      # react + react-dom + their @types are peer-coupled: bumped separately, each PR
      # fails npm's peer resolution against the other package still on the old major.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # eslint + @eslint/js are peer-coupled the same way: @eslint/js's peer range
      # tracks the eslint major, so bumping it alone fails npm's peer resolution
      # until eslint catches up in a separate PR. eslint-config-prettier has no
      # such constraint (peer eslint >=7.0.0) but is grouped in for one less PR.
      eslint:
        patterns:
          - "eslint"
          - "@eslint/js"
          - "eslint-config-prettier"
