name: Weekly Security Audit

on:
  schedule:
    - cron: "0 9 * * MON"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Dependency CVE scan (pip-audit, report-only)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --format json --output pip-audit.json || true
      - name: Claude security sweep (report-only)
        if: env.HAS_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude -p "Audit this guardrail codebase for dependency CVEs and unsafe patterns (rails that fail open, untrusted data reaching a tool/sink without a taint check, secrets in code). Report only, do not fix." \
            --allowedTools "Read,Grep,Bash(pip-audit:*)" \
            --output-format json > audit-report.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            pip-audit.json
            audit-report.json
          if-no-files-found: ignore
