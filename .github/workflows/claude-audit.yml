name: Weekly Security Audit

on:
  schedule:
    - cron: "0 9 * * MON"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Dependency CVE scan (pip-audit, report-only)
        run: |
          python -m pip install --upgrade pip pip-audit
          # Install the project so pip-audit scans the real dependency tree, not an
          # empty env (P8). --strict off / report-only: never fail the job on a CVE.
          pip install -e ".[dev]" || true
          pip-audit --format json --output pip-audit.json || true
      - name: Rust CVE scan (cargo audit, report-only)
        if: hashFiles('crates/guardrails-core/Cargo.toml') != ''
        run: |
          cargo install cargo-audit --locked || true
          cargo audit --file crates/guardrails-core/Cargo.lock --json > cargo-audit.json || true
      - name: Web CVE scan (npm audit, report-only)
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: |
          npm audit --json > ../npm-audit.json || true
      - name: Claude security sweep (report-only)
        if: env.HAS_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Pinned like every third-party action in this repo (P12).
          npm install -g @anthropic-ai/claude-code@2.1.218
          claude -p "Audit this guardrail codebase for dependency CVEs and unsafe patterns (rails that fail open, untrusted data reaching a tool/sink without a taint check, secrets in code). Report only, do not fix. If and only if you found no issues at all, end your report with the exact line NO_FINDINGS." \
            --allowedTools "Read,Grep,Bash(pip-audit:*)" \
            --output-format json > audit-report.json || true
      - name: Open or update the findings issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VULNS=$(jq '[.dependencies[]?.vulns[]?] | length' pip-audit.json 2>/dev/null || echo 0)
          CARGO_VULNS=$(jq '.vulnerabilities.count // 0' cargo-audit.json 2>/dev/null || echo 0)
          NPM_VULNS=$(jq '.metadata.vulnerabilities.total // 0' npm-audit.json 2>/dev/null || echo 0)
          CLAUDE_RESULT=$(jq -r '.result // empty' audit-report.json 2>/dev/null || true)
          CLAUDE_CLEAN=false
          if [ -z "$CLAUDE_RESULT" ] || printf '%s' "$CLAUDE_RESULT" | grep -q '^NO_FINDINGS$'; then
            CLAUDE_CLEAN=true
          fi
          if [ "$VULNS" -eq 0 ] && [ "$CARGO_VULNS" -eq 0 ] && [ "$NPM_VULNS" -eq 0 ] && [ "$CLAUDE_CLEAN" = true ]; then
            echo "No findings — not opening an issue."
            exit 0
          fi
          TITLE="Weekly security audit findings"
          {
            echo "Automated report from the [Weekly Security Audit](../actions/workflows/claude-audit.yml) run of $(date -u +%F)."
            echo
            echo "- **pip-audit (Python) vulnerabilities:** $VULNS"
            echo "- **cargo-audit (Rust core) vulnerabilities:** $CARGO_VULNS"
            echo "- **npm audit (web) vulnerabilities:** $NPM_VULNS"
            echo
            echo "Raw JSON in the run's \`security-report\` artifact."
            echo
            if [ -n "$CLAUDE_RESULT" ]; then
              echo "## Claude security sweep"
              echo
              printf '%s' "$CLAUDE_RESULT" | head -c 6000
              echo
            fi
          } > issue-body.md
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number' || true)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file issue-body.md
          else
            gh issue create --title "$TITLE" --body-file issue-body.md
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: security-report
          path: |
            pip-audit.json
            cargo-audit.json
            npm-audit.json
            audit-report.json
          if-no-files-found: ignore
