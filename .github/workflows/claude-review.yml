name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    # Dependabot version bumps get CI + human review; a token-billed LLM pass
    # over a lockfile diff adds nothing.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip when ANTHROPIC_API_KEY is not configured
        if: env.HAS_KEY != 'true'
        run: echo "ANTHROPIC_API_KEY secret not set — skipping Claude review. Add it in repo settings to enable."
      - uses: actions/checkout@v7
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1
        if: env.HAS_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "/review"
