name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Test (pytest)
        run: pytest -q

  rust-core:
    name: Rust core (fmt + clippy + test + wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Gate on crate manifest
        id: gate
        run: |
          if [ -f crates/guardrails-core/Cargo.toml ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "No crate yet — skipping Rust lane."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.go == 'true'
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.go == 'true'
        with:
          workspaces: crates/guardrails-core
      - name: fmt + clippy + test
        if: steps.gate.outputs.go == 'true'
        working-directory: crates/guardrails-core
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Build wheel + Python parity (Rust vs fallback)
        if: steps.gate.outputs.go == 'true'
        run: |
          python -m pip install --upgrade pip maturin pytest
          maturin build -m crates/guardrails-core/Cargo.toml --release --features extension-module -o dist
          pip install dist/*.whl
          python -c "import guardrails_core; print('guardrails_core', guardrails_core.version())"
          pytest -q tests/test_secrets_rail.py tests/test_spotlight_rail.py tests/test_sanitize_rail.py

  web:
    name: Web (tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Gate on package.json
        id: gate
        run: |
          if [ -f web/package.json ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "No web app yet — skipping web lane."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v6
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: "20"
      - name: install + typecheck + test
        if: steps.gate.outputs.go == 'true'
        working-directory: web
        run: |
          npm install
          npx tsc --noEmit
          npx vitest run

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-ok:
    name: CI passed
    runs-on: ubuntu-latest
    if: always()
    needs: [python, rust-core, web, secrets-scan]
    steps:
      - name: Require all lanes to succeed
        run: |
          for r in "${{ needs.python.result }}" "${{ needs.rust-core.result }}" "${{ needs.web.result }}" "${{ needs.secrets-scan.result }}"; do
            if [ "$r" != "success" ]; then echo "A required job did not succeed ($r)"; exit 1; fi
          done
          echo "All required jobs passed."
