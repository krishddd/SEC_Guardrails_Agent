name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Test (pytest)
        run: pytest -q
      - name: Gate summary (ASR / FPR, split)
        run: python scripts/gate_summary.py >> "$GITHUB_STEP_SUMMARY"

  rust-core:
    name: Rust core (fmt + clippy + test + wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Gate on crate manifest
        id: gate
        run: |
          if [ -f crates/guardrails-core/Cargo.toml ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "No crate yet — skipping Rust lane."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # SHA-pinned; toolchain via input
        if: steps.gate.outputs.go == 'true'
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: steps.gate.outputs.go == 'true'
        with:
          workspaces: crates/guardrails-core
      - name: fmt + clippy + test
        if: steps.gate.outputs.go == 'true'
        working-directory: crates/guardrails-core
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Build wheel + Python parity (Rust vs fallback)
        if: steps.gate.outputs.go == 'true'
        run: |
          python -m pip install --upgrade pip maturin pytest
          maturin build -m crates/guardrails-core/Cargo.toml --release --features extension-module -o dist
          pip install dist/*.whl
          python -c "import guardrails_core; print('guardrails_core', guardrails_core.version())"
          pytest -q tests/test_secrets_rail.py tests/test_spotlight_rail.py tests/test_sanitize_rail.py

  web:
    name: Web (tsc + eslint + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Gate on package.json
        id: gate
        run: |
          if [ -f web/package.json ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "No web app yet — skipping web lane."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install + typecheck + lint + test
        if: steps.gate.outputs.go == 'true'
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run test

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflow-lint:
    name: Workflow lint (actionlint + shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: actionlint (pinned; shellcheck is preinstalled on the runner)
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          curl -sSLo actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color

  ci-ok:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [python, rust-core, web, secrets-scan, workflow-lint]
    steps:
      - name: Require all lanes to succeed
        run: |
          for r in "${{ needs.python.result }}" "${{ needs.rust-core.result }}" "${{ needs.web.result }}" "${{ needs.secrets-scan.result }}" "${{ needs.workflow-lint.result }}"; do
            if [ "$r" != "success" ]; then echo "A required job did not succeed ($r)"; exit 1; fi
          done
          echo "All required jobs passed."
