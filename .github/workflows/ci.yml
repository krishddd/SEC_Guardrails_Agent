name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default.
permissions:
  contents: read

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Test (pytest)
        run: pytest -q

  rust-core:
    name: Rust core (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate on crate manifest
        id: gate
        run: |
          if [ -f crates/guardrails-core/Cargo.toml ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "No crate yet — skipping Rust lane."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.go == 'true'
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.go == 'true'
        with:
          workspaces: crates/guardrails-core
      - name: fmt + clippy + test
        if: steps.gate.outputs.go == 'true'
        working-directory: crates/guardrails-core
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  web:
    name: Web (tsc + eslint + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate on package.json
        id: gate
        run: |
          if [ -f web/package.json ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "No web app yet — skipping web lane."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install + tsc + eslint + vitest
        if: steps.gate.outputs.go == 'true'
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npx eslint .
          npx vitest run

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  ci-ok:
    name: CI passed
    runs-on: ubuntu-latest
    if: always()
    needs: [python, rust-core, web, secrets-scan]
    steps:
      - name: Require all lanes to succeed
        run: |
          for r in "${{ needs.python.result }}" "${{ needs.rust-core.result }}" "${{ needs.web.result }}" "${{ needs.secrets-scan.result }}"; do
            if [ "$r" != "success" ]; then echo "A required job did not succeed ($r)"; exit 1; fi
          done
          echo "All required jobs passed."
