name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (editable + dev)
        run: |
          python -m pip install --upgrade pip
          # Tolerate the pre-scaffold state: install only if a manifest exists yet.
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" || pip install -e .; fi
          pip install ruff pytest

      - name: Ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest
        run: pytest -q

  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if no crate yet
        id: gate
        run: |
          if [ -f crates/guardrails-core/Cargo.toml ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.go == 'true'
        with:
          components: clippy, rustfmt
      - name: fmt + clippy + test
        if: steps.gate.outputs.go == 'true'
        working-directory: crates/guardrails-core
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if no web app yet
        id: gate
        run: |
          if [ -f web/package.json ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install + tsc + eslint + vitest
        if: steps.gate.outputs.go == 'true'
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npx eslint .
          npx vitest run
